name: Diagnóstico de segurança

on:
  push:
    branches: [main]
  schedule:
    # Toda segunda-feira às 09:00 (horário de Brasília). Também detecta mudanças
    # feitas direto no painel do Supabase e mantém o projeto ativo no plano gratuito.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostico:
    name: Diagnóstico
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Aguardar deploy no Cloudflare
        id: deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="não encontrado"
          for i in $(seq 1 36); do
            r=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
                  --jq '[.check_runs[] | select(.name | startswith("Workers Builds"))][0] | "\(.status) \(.conclusion)"' || true)
            echo "Cloudflare: ${r:-sem resposta}"
            if [[ "$r" == completed* ]]; then status="${r#completed }"; break; fi
            sleep 20
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Executar verificações
        env:
          SITE_URL: https://rifa.formatura26.workers.dev
          DEPLOY_STATUS: ${{ steps.deploy.outputs.status }}
          # Após o build, aguarda a propagação da nova versão
          DEPLOY_WAIT_S: ${{ github.event_name == 'push' && '120' || '0' }}
        run: bash scripts/security-check.sh
